  - id: OPT2
    practice_id: BP6
    kind: recommendation
    source_status: verified
    source_anchor: S4, PDF p. 10, conditions of use, paragraph beginning When writing
    text: Document technical restrictions on API usage where an API exists.
    operational_interpretation: Optional technical terms supplement the baseline metadata-use conditions.
  - id: OPT3
    practice_id: BP7
    kind: recommendation
    source_status: verified
    source_anchor: S4, PDF p. 11, privacy policy, paragraph beginning When writing
    text: Link third-party analytics privacy policies and reserve the right to update the privacy policy.
    operational_interpretation: Optional suggestions; do not evaluate legal adequacy.
  - id: OPT4
    practice_id: BP9
    kind: recommendation
    source_status: verified
    source_anchor: S4, PDF p. 12, end-of-life policy, paragraph beginning Publishing
