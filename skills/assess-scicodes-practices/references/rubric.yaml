      content_read: false
      limitation: Network access to this host was blocked; no repository copy or export was supplied.
  practice_list_verification: >
    Practice titles below came from a secondary web-search summary that named
    the guide as its source. They are unverified against the primary source,
    as is their order. Confirm BP1-BP9 before relying on them.

outcomes: [met, unmet, unknown, not_applicable]

unknown_reasons:
  - applicability_unconfirmed   # provisional exclusion awaiting member confirmation
  - not_found_after_search      # not proof of noncompliance; request member confirmation
  - evidence_inaccessible
  - evidence_restricted
  - baseline_unresolved         # criterion has no verified source basis

# Exclusions (not_applicable) require a documented basis and member
# confirmation recording who confirmed and when.

# Ordered decision rules; the first rule whose conditions all hold wins.
# Condition vocabulary (combined with AND):
#   exact:         {outcome: n}   exact count of criteria with that outcome
#   min:           {outcome: n}   minimum count
#   equals_total:  [outcomes]     summed count equals the total criterion count
#   structure_valid: false        structural validation failed (rule 1 only)
#   otherwise: true               always matches (final rule only)
# Applicable criteria are those not confirmed not_applicable. Rule 2 is valid
# because met and unmet criteria are both confirmed applicable, so remaining
# unknowns cannot change the tier.
decision_rules:
  - id: R1
    result: invalid
    when: {structure_valid: false}
  - id: R2
    result: tier_1
    when: {min: {met: 1, unmet: 1}}
  - id: R3
    result: undetermined
    when: {min: {unknown: 1}}
  - id: R4
    result: not_applicable
    when: {equals_total: [not_applicable]}
  - id: R5
    result: tier_2
    when: {exact: {unmet: 0, unknown: 0}, min: {met: 1}}
  - id: R6
    result: tier_0
    when: {exact: {met: 0, unknown: 0}, min: {unmet: 1}}
  - id: R7
    result: invalid
    when: {otherwise: true}

results:
  tier_0: All applicable baseline criteria are confirmed unmet.
  tier_1: Confirmed applicable baseline criteria include both met and unmet.
  tier_2: All applicable baseline criteria are met.
  undetermined: Unknowns prevent a definitive tier.
  not_applicable: All criteria are confirmed not applicable.
  invalid: Structure or coverage failure, or no rule matched.

# Optional enhancements never enter baseline counts or tiers.
optional_enhancements: []

