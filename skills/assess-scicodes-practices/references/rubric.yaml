    operational_interpretation: A formal agreement is an optional preparation step, not a mandatory named partner.
practices:
  - id: BP1
    title: Provide a public scope statement
    title_status: verified_scorecard
    criteria:
      - id: BP1.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 6, scope statement, bullet 1
        text: Describe accepted software in terms of scientific discipline, technical characteristics, and
          administrative properties.
        operational_interpretation: Look for an accessible scope statement addressing the relevant acceptance
          dimensions; do not impose a particular discipline or software format.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP1.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 6, scope statement, bullet 2
        text: Describe software characteristics that exclude entries from the resource.
        operational_interpretation: Accept explicit statements of unrestricted dimensions; absence of a restriction
          in a search result is not an explicit policy.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP1.3
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 6, scope statement, bullet 3
        text: Describe notable exceptions to acceptance and exclusion rules, if any.
        operational_interpretation: Check stated exceptions; do not invent exceptions or require the resource
          to have them.
        applicability_guidance: Conditional on exceptions existing. An explicit no-exceptions statement satisfies
          disclosure; otherwise confirm applicability.
  - id: BP2
    title: Provide user guidance
    title_status: verified_scorecard
    criteria:
      - id: BP2.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 7, user guidance, bullet 1
        text: Explain common user tasks such as searching and accessing an entry.
        operational_interpretation: Check guidance for the tasks actually offered; the example tasks do not
          require a specific interface.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP2.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 7, user guidance, bullet 2
        text: Answer frequent or anticipated user questions.
        operational_interpretation: A FAQ, contextual help, or equivalent guidance can satisfy this recommendation.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP2.3
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 7, user guidance, bullet 3
        text: Identify a contact point for questions or help.
        operational_interpretation: Look for a usable published support route; do not contact it during the
          assessment.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP2.4
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 7, user guidance, paragraph beginning When writing
        text: Identify user types and corresponding use cases when developing guidance.
        operational_interpretation: Assess whether guidance addresses identifiable audiences and their tasks;
          a separate audience-analysis document is not required.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP2.5
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 7, user guidance, paragraph beginning When writing
        text: Offer guidance in multiple forms.
        operational_interpretation: Look for complementary forms such as prompts and linked explanations; the
          named formats are examples, not a mandatory checklist.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP2.6
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 7, user guidance, paragraph beginning When writing
        text: Document machine-readable access and its supported formats, including content negotiation where
          enabled.
        operational_interpretation: Follow API documentation or an interface-provided pointer; do not require
          an API, JSON-LD, XML, or content negotiation.
        applicability_guidance: Applies when machine-readable access is offered. Content-negotiation details
          apply only when enabled.
  - id: BP3
    title: Provide guidance to software contributors
    title_status: verified_scorecard
    criteria:
      - id: BP3.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, contributor policy, bullet 1
        text: Describe who can and cannot submit entries or metadata.
        operational_interpretation: Check eligibility and submission permissions in contributor-facing guidance.
        applicability_guidance: Applies to contribution or record-update workflows, including mediated submissions.
          Confirm exclusion only if no such workflow exists.
      - id: BP3.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, contributor policy, bullet 2
        text: Describe required and optional metadata for deposited software.
        operational_interpretation: Check a documented distinction between required and optional submission
          information.
        applicability_guidance: Applies to contribution or record-update workflows, including mediated submissions.
          Confirm exclusion only if no such workflow exists.
      - id: BP3.3
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, contributor policy, bullet 3
        text: Describe any review process.
        operational_interpretation: A statement that there is no review process satisfies the disclosure question;
          do not require review.
        applicability_guidance: Applies to contribution or record-update workflows, including mediated submissions.
          Confirm exclusion only if no such workflow exists.
      - id: BP3.4
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, contributor policy, bullet 4
        text: Describe any curation process.
        operational_interpretation: An explicit no-curation statement is acceptable; assess disclosure, not
          a required curation model.
        applicability_guidance: Applies to contribution or record-update workflows, including mediated submissions.
          Confirm exclusion only if no such workflow exists.
      - id: BP3.5
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, contributor policy, bullet 5
        text: Explain who can update entries, when updates occur, and how they are made.
        operational_interpretation: Check the update workflow, including any policy against updates.
        applicability_guidance: Applies to contribution or record-update workflows, including mediated submissions.
          Confirm exclusion only if no such workflow exists.
      - id: BP3.6
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, contributor policy, paragraph beginning Topics
        text: Consider author contact when a contributor is not an author, including whether contact is required
          or follows submission.
        operational_interpretation: Look for the stated handling of third-party submissions, without requiring
          a particular contact policy.
        applicability_guidance: Applies if third-party contributions are allowed; otherwise document the exclusion.
      - id: BP3.7
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, contributor policy, paragraph beginning Topics
        text: Describe how persistent identifiers are assigned when used.
        operational_interpretation: Check assignment guidance; do not require a DOI or another specific identifier.
        applicability_guidance: Applies when persistent identifiers are assigned by or through the resource.
      - id: BP3.8
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, contributor policy, paragraph beginning Topics
        text: State that depositors must comply with applicable laws and avoid intentionally malicious conduct.
        operational_interpretation: Assess the presence of this statement, not legal adequacy or actual depositor
          behavior.
        applicability_guidance: Applies to contribution or record-update workflows, including mediated submissions.
          Confirm exclusion only if no such workflow exists.
  - id: BP4
    title: Establish an authorship policy
    title_status: verified_scorecard
    criteria:
      - id: BP4.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 9, authorship policy, bullet 1
        text: Specify how authorship is determined by contributors or the resource.
        operational_interpretation: Check authorship criteria without imposing a particular authorship definition.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP4.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 9, authorship policy, bullet 2
        text: Specify policies for changes to authorship.
        operational_interpretation: Look for guidance on adding, removing, or correcting authorship.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP4.3
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 9, authorship policy, bullet 3
        text: Describe the process for resolving authorship disputes.
        operational_interpretation: Check a published process or responsibility, without attempting to adjudicate
          disputes.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP4.4
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 8, authorship policy, final paragraph
        text: Keep authorship policy consistent with resource citation policy.
        operational_interpretation: Compare policy statements; software-specific citation requirements may
          remain with owners.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP4.5
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 9, authorship policy, paragraph beginning When defining
        text: Consider credit for non-coders, author ordering, large author lists, and group or consortium
          authorship.
        operational_interpretation: Look for how the policy handles these cases; no particular ordering or
          credit scheme is required.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP4.6
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 9, authorship policy, paragraph beginning When defining
        text: Consider a contribution-role vocabulary to describe author contributions.
        operational_interpretation: Document evidence of consideration or an explained alternative; do not
          require CRediT specifically.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
  - id: BP5
    title: Share metadata schema
    title_status: verified_scorecard
    criteria:
      - id: BP5.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 9, metadata schema, bullet 1
        text: Publish the metadata schema and version, linking standard-schema documentation or documenting
          a custom schema.
        operational_interpretation: Check publicly available schema identification and version plus a reference,
          description, or data dictionary; do not require CodeMeta or schema.org.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP5.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 9, metadata schema, bullet 2
        text: Describe expected submission metadata, required and optional fields, and their content formats.
        operational_interpretation: Check field-level documentation; no particular metadata fields are imposed.
        applicability_guidance: Applies to contribution or record-update workflows, including mediated submissions.
          Confirm exclusion only if no such workflow exists.
  - id: BP6
    title: Stipulate conditions of use
    title_status: verified_scorecard
    criteria:
      - id: BP6.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 10, conditions of use, bullet 1
        text: Include disclaimers about resource responsibility and liability.
        operational_interpretation: Check published disclaimers; do not assess enforceability.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP6.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 10, conditions of use, bullet 2
        text: Provide license and copyright information for entries and for the resource as a whole.
        operational_interpretation: Distinguish metadata licensing from software or binary licensing where
          present; do not invent or require a specific license.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP6.3
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 10, conditions of use, bullet 3 and introductory paragraph
        text: State conditions and prohibitions for metadata use, including commercial and aggregate use.
        operational_interpretation: Look for explicit reuse terms; do not infer permission from technical accessibility.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP6.4
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 10, conditions of use, bullet 4
        text: Provide a preferred format for citing software entries.
        operational_interpretation: Accept a citation example or applicable guidance; do not impose a citation
          style.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP6.5
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 10, conditions of use, bullet 5
        text: Provide a preferred format for attributing or citing the resource.
        operational_interpretation: Distinguish resource attribution from citing an individual software entry.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
  - id: BP7
    title: State a privacy policy
    title_status: verified_scorecard
    criteria:
      - id: BP7.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, bullet 1
        text: Describe information collected about users and its retention period.
        operational_interpretation: Check the policy for collection and retention disclosures, including explicit
          statements of no collection.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP7.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, bullet 2
        text: Describe how collected information, especially personal data, is used.
        operational_interpretation: Assess declared purposes, not legal compliance.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP7.3
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, bullet 3
        text: State whether tracking occurs and, if so, what is tracked and how.
        operational_interpretation: An explicit no-tracking statement can satisfy this criterion; do not assume
          tracking from site technology.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP7.4
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, bullet 4
        text: State whether cookies are used.
        operational_interpretation: An explicit no-cookies statement can satisfy disclosure; a particular consent
          mechanism is not prescribed here.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP7.5
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, paragraph beginning When writing
        text: Detail personal data collected, the justification, and whether they are sold or shared.
        operational_interpretation: Look for these disclosures, including negative declarations where relevant.
        applicability_guidance: Personal-data details apply when data are collected; explicitly documented
          non-collection can satisfy the disclosure.
      - id: BP7.6
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, paragraph beginning When writing
        text: Explicitly list third-party tools used to collect analytics.
        operational_interpretation: Check named tools where analytics are used; linking their privacy policies
          is optional.
        applicability_guidance: Applies when third-party analytics are used; confirm an exclusion otherwise.
      - id: BP7.7
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, paragraph beginning When writing
        text: Announce potential emails resulting from visiting or downloading content.
        operational_interpretation: Check disclosure of such solicitations or notifications; do not send or
          subscribe to emails.
        applicability_guidance: Applies when these email workflows exist.
      - id: BP7.8
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, paragraph beginning When writing
        text: Explain privacy protections and state whether the resource complies with relevant privacy laws
          where applicable.
        operational_interpretation: Assess disclosure of protections and the resource's compliance statements
          only; do not certify compliance or infer jurisdiction.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP7.9
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, privacy policy, paragraph beginning When writing
        text: Describe how users can request removal of their personal information.
        operational_interpretation: Look for a request mechanism; do not submit a request.
        applicability_guidance: Applies when personal information is held. Confirm exclusion for resources
          that hold none.
  - id: BP8
    title: Provide a retention policy
    title_status: verified_scorecard
    criteria:
      - id: BP8.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, retention policy, bullet 1
        text: State how long metadata and files are expected to be retained.
        operational_interpretation: Assess metadata for registries and metadata plus stored files for hosting
          resources; do not require permanent retention.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP8.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, retention policy, bullet 2
        text: Describe the conditions under which metadata or files are removed.
        operational_interpretation: Check declared removal conditions, including any explicit no-removal policy.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP8.3
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, retention policy, bullet 3
        text: Identify who has responsibility and authority to remove information.
        operational_interpretation: Check roles and permissions at policy level.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP8.4
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 11, retention policy, bullet 4
        text: Describe procedures for requesting removal of metadata or files.
        operational_interpretation: Check published procedures or a clearly stated refusal policy; do not initiate
          removal.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP8.5
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, retention policy, paragraph beginning The policy
        text: Address identifier resolvability, retention, and non-reuse.
        operational_interpretation: Check the stated treatment of persistent identifiers after removal.
        applicability_guidance: Applies when persistent identifiers are used.
      - id: BP8.6
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, retention policy, paragraph beginning The policy
        text: Set retention expectations in the context of the organization and its funding.
        operational_interpretation: Look for a contextual rationale or limits; do not prescribe a numeric duration
          or invent funding commitments.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP8.7
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, retention policy, paragraph beginning The policy
        text: State who can edit metadata or delete records and files, and how consistency is preserved.
        operational_interpretation: Check documented edit and deletion controls relevant to the resource functions.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP8.8
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, retention policy, paragraph beginning The policy
        text: Document taking data offline, archiving it, and possible retrieval.
        operational_interpretation: Check the lifecycle process and retrieval limits; do not require an offline
          archive if no such workflow exists.
        applicability_guidance: Applies when offline or archival workflows exist; confirm exclusions.
  - id: BP9
    title: Disclose your end-of-life policy
    title_status: verified_scorecard
    criteria:
      - id: BP9.1
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, end-of-life policy, bullet 1
        text: Describe circumstances in which the resource might end its services.
        operational_interpretation: Check a published closure contingency; do not invent triggers.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP9.2
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, end-of-life policy, bullet 2
        text: Describe the consequences of closure.
        operational_interpretation: Look for expected availability, access conditions, and restrictions after
          closure, without requiring uninterrupted service.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP9.3
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, end-of-life policy, bullet 3
        text: State what happens to metadata and software artifacts on closure.
        operational_interpretation: Cover metadata and, where hosted, software artifacts; do not infer preservation
          from a general sustainability statement.
        applicability_guidance: Applies to all resources. Confirm any exclusion with the member; missing evidence
          is unknown.
      - id: BP9.4
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, end-of-life policy, bullet 4
        text: Identify a migration destination when long-term preservation is expected.
        operational_interpretation: Check a named destination or documented arrangement; no particular repository
          is required.
        applicability_guidance: Conditional on expected long-term preservation by migration. Record uncertainty
          rather than inventing a successor.
      - id: BP9.5
        kind: recommendation
        source_status: verified
        source_anchor: S4, PDF p. 12, end-of-life policy, bullet 5
        text: Explain how a migration will be funded.
        operational_interpretation: Check the stated funding arrangement or its limits; assess disclosure,
          not financial viability.
        applicability_guidance: Applies when migration is planned; confirm exclusion if no migration is intended.
