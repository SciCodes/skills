# Experimental assessment interpretation pending SciCodes review.
# This file is the single authoritative home for criteria, applicability
# guidance, and tier decision rules. Do not restate tier logic elsewhere.
rubric_version: 0.1.0-draft
status: experimental_skeleton_pending_scicodes_review
status_note: >
  Detailed baseline criteria could not be transcribed because the primary
  sources were inaccessible during repository initialization (see baseline).
  Each practice therefore carries one placeholder criterion with
  source_status "unresolved". Overview headings cannot supply detailed
  criteria, so no criterion text has been invented. Replace each placeholder
  with verified, anchored criteria before using this rubric for judgments.

baseline:
  selected: null
  selection_note: >
    No baseline was explicitly selected and none could be verified. Candidate:
    the detailed guide below, or an authoritative journal version or successor
    if one exists (not checked). Record the selected version and source anchors
    here when resolved.
  version: unresolved
  sources:
