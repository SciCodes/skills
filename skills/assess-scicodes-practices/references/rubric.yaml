criterion_policy:
  source_text: Paraphrases, not quotations; page and paragraph or bullet anchors refer to S4.
  selection: >
    Include the nine sections' enumerated recommendations and their additional
    should/advisable/consider guidance. Keep optional may/might suggestions
    outside baseline counts. Named resources, technologies, licenses and
    durations used as examples are not mandatory requirements.
  granularity: >
    Preserve each enumerated bullet as one criterion; additional recommendation
    paragraphs are grouped by topic. A grouped criterion is met only when all
    applicable parts are supported. This grouping affects scores and is an
    assessor interpretation; compare versions before claiming improvement.
  evidence: >
    These are chiefly policy and guidance disclosure recommendations. An
    applicable published statement can satisfy a disclosure criterion without
    proving implementation of the promised service. Report that distinction.
    A private policy draft alone does not establish public disclosure.
  applicability: >
    Apply to resource functions, not labels such as registry versus repository.
    Explicit statements that a feature is absent can satisfy a disclosure
    question; do not demand a feature merely to document it. Conditional
    exclusions require documented member confirmation, otherwise unknown.
    Lack of public evidence is unknown, not proof that a policy is absent.
  legal_scope: >
    Assess what policies disclose, not legal validity or compliance. Do not
    adopt the article's legal examples as current legal advice.

scorecard_alignment:
  source: S3
  scale_anchor: Sheet1.B2
  interpretation: >
    The scorecard allows each resource to interpret coverage using desirable
    guidance items. For reproducibility this skill counts equally weighted,
    confirmed applicable baseline criteria; confirmed exclusions are omitted.
    Met criteria establish implementation of those items; no met criteria with
    all applicable criteria confirmed unmet is operationalized as score 0.
    Any unknown criterion defers the score. These are assessor conventions,
    not additional requirements stated by the scorecard. Record applicability
    decisions and confirm exclusions with the member before comparing scores.
  historical_values: >
    Preserve original scores, including fractions, N/A, blanks, and out-of-scale
    entries without rounding or conversion. New derived scores use the declared
    integer scale; unknown is not zero or N/A. Do not calculate member aggregates.

outcomes: [met, unmet, unknown, not_applicable]

unknown_reasons:
  - applicability_unconfirmed   # provisional exclusion awaiting member confirmation
  - not_found_after_search      # not proof of noncompliance; request member confirmation
  - evidence_inaccessible
  - evidence_restricted
  - baseline_unresolved         # criterion has no verified source basis

# Exclusions (not_applicable) require a documented basis and member
# confirmation recording who confirmed and when.

# Ordered decision rules; the first rule whose conditions all hold wins.
# Condition vocabulary (combined with AND):
#   exact:         {outcome: n}   exact count of criteria with that outcome
#   min:           {outcome: n}   minimum count
#   equals_total:  [outcomes]     summed count equals the total criterion count
#   structure_valid: false        structural validation failed (rule 1 only)
#   otherwise: true               always matches (final rule only)
# max_met_fraction: upper bound on met / (met + unmet), inclusive.
# Rules defer unknowns before using coverage fractions. All exclusions are
# handled before fractions, so zero-denominator fractions cannot assign scores.
decision_rules:
  - id: R1
    result: invalid
    when: {structure_valid: false}
  - id: R2
    result: undetermined
    when: {min: {unknown: 1}}
  - id: R3
    result: not_applicable
    when: {equals_total: [not_applicable]}
  - id: R4
    result: score_0
    when: {exact: {met: 0}, min: {unmet: 1}}
  - id: R5
    result: score_4
    when: {exact: {unmet: 0}, min: {met: 1}}
  - id: R6
    result: score_1
    when: {min: {met: 1}, max_met_fraction: 0.25}
  - id: R7
    result: score_2
    when: {min: {met: 1}, max_met_fraction: 0.5}
  - id: R8
    result: score_3
    when: {min: {met: 1, unmet: 1}}
  - id: R9
    result: invalid
    when: {otherwise: true}

# Verbatim scale descriptions from the supplied scorecard, Sheet1.B2.
results:
  score_0: Best practice has not been implemented in any form
  score_1: Have implemented the best practice, but it needs improvement/meets up to 25% of the recommended guidance
  score_2: Have implemented the best practice, and it meets up to half of the recommended guidance
  score_3: Have implemented the best practice, and it meets more than half but not all of the recommended guidance
  score_4: Have implemented the best practice, and it meets all of the recommended guidance
  not_applicable: Not applicable to the resource
  undetermined: Evidence or baseline uncertainty prevents a score.
  invalid: Structure or coverage failure, or no rule matched.

